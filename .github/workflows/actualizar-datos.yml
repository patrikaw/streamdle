name: Actualizar datos de streamers

# Los días 1 y 16 de cada mes (~cada 15 días). También se puede lanzar a mano
# desde la pestaña Actions -> "Actualizar datos de streamers" -> Run workflow.
on:
  schedule:
    - cron: '0 12 1,16 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Actualizar seguidores de Twitch y Kick
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node scripts/actualizar-datos.mjs --write

      - name: Publicar los cambios en main
        run: |
          if git diff --quiet -- data/streamers.js data/historial.json; then
            echo "Sin cambios."
            cat scripts/ultimo-reporte.md 2>/dev/null || true
            exit 0
          fi
          cp data/streamers.js /tmp/control.mjs
          node --check /tmp/control.mjs
          n=$(grep -c '^  {id:' data/streamers.js)
          if [ "$n" -lt 200 ]; then
            echo "El archivo de datos quedó con solo $n streamers: no se publica."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/streamers.js data/historial.json
          git commit -m "Actualización automática de seguidores ($(date +%Y-%m-%d))"
          git push origin HEAD:main
