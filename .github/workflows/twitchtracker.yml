name: Actualizar TwitchTracker (horas, peak, categorías)

# El día 3 de cada mes. Si TwitchTracker bloquea a GitHub (Cloudflare) el job termina
# sin cambios y avisa en el log; en ese caso correr scripts/twitchtracker-local.bat en la PC.
on:
  schedule:
    - cron: '0 14 3 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  twitchtracker:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: browser-actions/setup-chrome@v1

      - name: Instalar dependencias
        run: pip install selenium undetected-chromedriver setuptools

      - name: Leer TwitchTracker
        run: python scripts/twitchtracker.py --write

      - name: Publicar los cambios en main
        run: |
          if git diff --quiet -- data/streamers.js; then
            echo "Sin cambios."
            cat scripts/ultimo-reporte-tt.md 2>/dev/null || true
            exit 0
          fi
          cp data/streamers.js /tmp/control.mjs
          node --check /tmp/control.mjs
          n=$(grep -c '^  {id:' data/streamers.js)
          if [ "$n" -lt 200 ]; then
            echo "El archivo de datos quedó con solo $n streamers: no se publica."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/streamers.js
          git commit -m "Actualización automática de TwitchTracker ($(date +%Y-%m-%d))"
          git push origin HEAD:main
