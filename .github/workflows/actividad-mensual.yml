name: Guardar actividad del mes anterior

# El día 1 de cada mes (después de la actualización de seguidores) guarda cuánto transmitió cada streamer el mes anterior.
on:
  schedule:
    - cron: '0 15 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actividad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Calcular la actividad del mes anterior
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node scripts/actividad-mensual.mjs

      - name: Publicar los cambios en main
        run: |
          if git diff --quiet -- data/actividad.json; then
            echo "Sin cambios."
            exit 0
          fi
          node -e "JSON.parse(require('fs').readFileSync('data/actividad.json','utf8'))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/actividad.json
          git commit -m "Actividad mensual guardada ($(date +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin HEAD:main
